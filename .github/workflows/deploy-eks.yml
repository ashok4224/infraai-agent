name: Build & Deploy to AWS EKS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/deploy-eks.yml'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to build and deploy'
        required: true
        type: choice
        options:
          - all
          - backend
          - frontend
        default: 'all'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 803103365620.dkr.ecr.ap-south-1.amazonaws.com
  CLUSTER_NAME: infraai-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'backend' || github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/
          file: backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/infraai/backend:latest
            ${{ env.ECR_REGISTRY }}/infraai/backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/infraai/backend:latest
          cache-to: type=inline

      - name: Build and push Frontend
        if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'frontend' || github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          file: frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.ECR_REGISTRY }}/infraai/frontend:latest
            ${{ env.ECR_REGISTRY }}/infraai/frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/infraai/frontend:latest
          cache-to: type=inline

  deploy-to-eks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - name: Apply Kubernetes secret from GitHub Secrets
        run: |
          DB_URL="${{ secrets.DATABASE_URL }}"
          if [[ "$DB_URL" == *"CHANGE_ME"* ]] || [[ "$DB_URL" == *"infraai-pg"* ]] || [[ -z "$DB_URL" ]]; then
            echo "⚠️  DATABASE_URL secret looks like a placeholder or is unset — skipping secret apply to protect existing cluster secret."
            echo "   Please update the DATABASE_URL GitHub Actions secret to: postgresql+asyncpg://pgadmin:ChangeMe123!@postgres:5432/infraaiagent"
            exit 0
          fi
          kubectl create secret generic infraai-secrets \
            --namespace infraai \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --from-literal=ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            --from-literal=AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            --from-literal=AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
            --from-literal=AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
            --from-literal=AZURE_AI_FOUNDRY_KEY="${{ secrets.AZURE_AI_FOUNDRY_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply K8s manifests
        run: kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s/overlays/eks/ | kubectl apply -f -

      - name: Restart backend deployment
        if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'backend' || github.event_name == 'push' }}
        run: kubectl rollout restart deployment/infraai-backend -n infraai

      - name: Restart frontend deployment
        if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'frontend' || github.event_name == 'push' }}
        run: kubectl rollout restart deployment/infraai-frontend -n infraai

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/infraai-backend -n infraai --timeout=5m
          kubectl rollout status deployment/infraai-frontend -n infraai --timeout=5m

      - name: Verify
        run: |
          kubectl get nodes
          kubectl get pods -n infraai
          kubectl get svc -n infraai
          kubectl get ingress -n infraai