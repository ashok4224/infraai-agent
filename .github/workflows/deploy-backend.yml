name: Deploy Backend to Azure App Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'production'
      resource_group:
        description: 'Azure Resource Group'
        required: false
        default: 'infraai-rgp'
      app_name:
        description: 'Backend App Service name'
        required: false
        default: 'infraai-backend'
      frontend_app_name:
        description: 'Frontend App Service name (for CORS)'
        required: false
        default: 'infraai-frontend'
      acr_name:
        description: 'Azure Container Registry name'
        required: false
        default: 'infraaiacr'
      postgres_server_name:
        description: 'PostgreSQL server name'
        required: false
        default: '10.0.8.68'

permissions:
  id-token: write
  contents: read

env:
  RG: ${{ inputs.resource_group || 'infraai-rgp' }}
  AZURE_WEBAPP_NAME: ${{ inputs.app_name || 'infraai-backend' }}
  FRONTEND_APP: ${{ inputs.frontend_app_name || 'infraai-frontend' }}
  ACR: ${{ inputs.acr_name || 'infraaiacr' }}
  ACR_LOGIN_SERVER: ${{ format('{0}.azurecr.io', inputs.acr_name || 'infraaiacr') }}
  PG_SERVER: ${{ inputs.postgres_server_name || '10.0.8.68' }}
  IMAGE_NAME: infraai/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image via ACR Tasks
        run: |
          az acr build \
            --registry $ACR \
            --resource-group $RG \
            --image $IMAGE_NAME:${{ github.sha }} \
            --image $IMAGE_NAME:latest \
            --file backend/Dockerfile.prod \
            backend/

      - name: Configure App Service container
        run: |
          # Use managed identity for ACR pull (no admin credentials)
          az webapp config set --resource-group $RG --name $AZURE_WEBAPP_NAME \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'

          az webapp config container set \
            --resource-group $RG --name $AZURE_WEBAPP_NAME \
            --container-image-name $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            --container-registry-url https://$ACR_LOGIN_SERVER

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update app settings
        run: |
          PG_HOST="${PG_SERVER}"
          az webapp config appsettings set \
            --resource-group $RG --name $AZURE_WEBAPP_NAME \
            --settings \
              DATABASE_URL="postgresql+asyncpg://postgres_admin:${{ secrets.DB_PASSWORD }}@${PG_HOST}:5432/infraai?ssl=require" \
              SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
              ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              APP_ENV="${{ inputs.environment || 'production' }}" \
              LOG_LEVEL="INFO" \
              CORS_ORIGINS="https://${FRONTEND_APP}.azurewebsites.net" \
              WEBSITES_PORT="8000" \
              WEBSITE_VNET_ROUTE_ALL=1

      - name: Restart and verify
        run: |
          az webapp restart --resource-group $RG --name $AZURE_WEBAPP_NAME
          echo "Waiting 45s for container to start (runs migrations on boot)..."
          sleep 45
          for i in 1 2 3 4; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/api/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy — migrations applied, app running"
              exit 0
            fi
            sleep 15
          done
          echo "⚠️  Backend not responding — check logs:"
          echo "    az webapp log tail -g $RG -n $AZURE_WEBAPP_NAME"
          exit 1
