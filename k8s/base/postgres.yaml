apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: infraai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: infraaiagent
            - name: POSTGRES_USER
              value: pgadmin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pgadmin"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # Use "oci-bv" for OKE, "managed-csi" for AKS
        storageClassName: managed-csi
        resources:
          requests:
            storage: 20Gi
  # Additional volumes (non-PVC)
  # Note: ConfigMap volume is defined in the pod spec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: infraai
data:
  init.sql: |
    -- Ensure the application database user has proper permissions
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO CURRENT_USER;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO CURRENT_USER;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO CURRENT_USER;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO CURRENT_USER;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infraai
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
  clusterIP: None
