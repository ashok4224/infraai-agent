apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  # secrets.yaml is intentionally excluded - manage infraai-secrets directly on the cluster
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: infraai-agent
      app.kubernetes.io/managed-by: kustomize
