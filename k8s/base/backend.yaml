apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraai-backend
  namespace: infraai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infraai-backend
  template:
    metadata:
      labels:
        app: infraai-backend
    spec:
      containers:
        - name: backend
          image: REGISTRY/infraai/backend:latest   # Replace REGISTRY
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: SECRET_KEY
            - name: ADMIN_EMAIL
              value: "admin@winfosolutions.com"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: ADMIN_PASSWORD
            - name: APP_ENV
              value: "production"
            - name: CORS_ORIGINS
              value: "https://infraai.yourdomain.com"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: infraai-backend
  namespace: infraai
spec:
  selector:
    app: infraai-backend
  ports:
    - port: 8000
      targetPort: 8000
