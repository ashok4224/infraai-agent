apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraai-frontend
  namespace: infraai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infraai-frontend
  template:
    metadata:
      labels:
        app: infraai-frontend
    spec:
      containers:
        - name: frontend
          image: REGISTRY/infraai/frontend:latest   # Replace REGISTRY
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://infraai-backend:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: infraai-frontend
  namespace: infraai
spec:
  selector:
    app: infraai-frontend
  ports:
    - port: 80
      targetPort: 80
