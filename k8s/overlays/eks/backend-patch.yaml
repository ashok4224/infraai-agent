apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraai-backend
  namespace: infraai
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: SECRET_KEY
            - name: ADMIN_EMAIL
              value: "admin@winfosolutions.com"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: ADMIN_PASSWORD
            - name: APP_ENV
              value: "dev"
            - name: CORS_ORIGINS
              value: "*"
            - name: AZURE_AI_FOUNDRY_ENDPOINT
              value: "https://winfo-infra-agent-resource.services.ai.azure.com/api/projects/infra-agent"
            - name: AZURE_AI_FOUNDRY_PROJECT
              value: "infra-agent"
            - name: AZURE_AI_FOUNDRY_MODEL_DEPLOYMENT
              value: "gpt-4o"
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_AI_FOUNDRY_KEY
              valueFrom:
                secretKeyRef:
                  name: infraai-secrets
                  key: AZURE_AI_FOUNDRY_KEY
            - name: AZURE_OUTLOOK_SENDER
              value: "noreply@winfosolutions.com"
          volumeMounts:
            - name: foundry-patch
              mountPath: /app/app/services/azure_foundry_service.py
              subPath: azure_foundry_service.py
            - name: foundry-patch
              mountPath: /app/app/config.py
              subPath: config.py
            - name: foundry-patch
              mountPath: /app/app/services/foundry_analyzer.py
              subPath: foundry_analyzer.py
            - name: foundry-patch
              mountPath: /app/app/services/chat_service.py
              subPath: chat_service.py
            - name: foundry-patch
              mountPath: /app/app/services/alert_analyzer.py
              subPath: alert_analyzer.py
            - name: foundry-patch
              mountPath: /app/app/services/foundry_tools/aws_mcp_server.py
              subPath: aws_mcp_server.py
            - name: foundry-patch
              mountPath: /app/app/services/foundry_tools/azure_mcp_server.py
              subPath: azure_mcp_server.py
            - name: foundry-patch
              mountPath: /app/app/services/foundry_tools/__init__.py
              subPath: __init__.py
            - name: foundry-patch
              mountPath: /app/app/services/knowledge_connectors.py
              subPath: knowledge_connectors.py
            - name: foundry-patch
              mountPath: /app/app/services/knowledge_retrieval_service.py
              subPath: knowledge_retrieval_service.py
            - name: foundry-patch
              mountPath: /app/app/routers/knowledge.py
              subPath: knowledge_router.py
            - name: foundry-patch
              mountPath: /app/app/services/knowledge_sync_service.py
              subPath: knowledge_sync_service.py
            - name: foundry-patch
              mountPath: /app/app/services/foundry_tools/kubernetes_mcp_server.py
              subPath: kubernetes_mcp_server.py
            - name: foundry-patch
              mountPath: /app/app/services/master_agent.py
              subPath: master_agent.py
            - name: foundry-patch
              mountPath: /app/app/services/mcp_service.py
              subPath: mcp_service.py
            - name: foundry-patch
              mountPath: /app/app/services/tool_registry.py
              subPath: tool_registry.py
            - name: foundry-patch
              mountPath: /app/app/routers/foundry_config.py
              subPath: foundry_config.py
      volumes:
        - name: foundry-patch
          configMap:
            name: foundry-service-patch
