# OCIR pull secret — replace with real credentials before applying
# Generate with: kubectl create secret docker-registry ocir-secret \
#   --namespace infraai \
#   --docker-server=<region>.ocir.io \
#   --docker-username='<tenancy>/<username>' \
#   --docker-password='<auth_token>' \
#   --dry-run=client -o yaml > ocir-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ocir-secret
  namespace: infraai
type: kubernetes.io/dockerconfigjson
data:
  # base64-encoded docker config — replace with real value
  .dockerconfigjson: e30=
